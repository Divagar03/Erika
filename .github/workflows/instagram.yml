name: Instagram Automation

on:
  schedule:
    # 4 Reels daily spaced evenly across peak global engagement hours:
    # 03:00 UTC (08:30 IST / 11:00 PM EST prev day - Asia morning)
    # 09:00 UTC (14:30 IST / 10:00 AM CET - Europe morning)
    # 15:00 UTC (20:30 IST / 11:00 AM EST - US East Coast peak)
    # 21:00 UTC (02:30 IST / 05:00 PM EST - US West Coast peak)
    - cron: "0 3 * * *"
    - cron: "0 9 * * *"
    - cron: "0 15 * * *"
    - cron: "0 21 * * *"
  push:
    paths:
      - "uploads/*.mp4"
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode to run"
        required: true
        default: "reel"
        type: choice
        options:
          - reel
          - weekly_reel
          - post
          - upload_reel

permissions:
  contents: write

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Configure Git identity
        run: |
          git config user.name "ig-influencer-bot"
          git config user.email "ig-influencer-bot@users.noreply.github.com"

      - name: Determine mode
        id: mode
        run: |
          # workflow_dispatch takes explicit mode input
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          # Push to uploads/*.mp4 → upload_reel
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "mode=upload_reel" >> "$GITHUB_OUTPUT"
          else
            # 4x daily scheduled runs: post a Reel
            echo "mode=reel" >> "$GITHUB_OUTPUT"
          fi

      - name: Run automation
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python main.py ${{ steps.mode.outputs.mode }}
