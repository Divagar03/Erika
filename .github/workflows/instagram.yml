name: Instagram Automation

on:
  schedule:
    # 12 Reels daily (every 2 hours): 00:00, 02:00, 04:00, 06:00, 08:00, 10:00, 12:00, 14:00, 16:00, 18:00, 20:00, 22:00 UTC
    - cron: "0 */2 * * *"
    # 1 Photo post daily at 13:00 UTC (18:30 IST / 09:00 AM EST)
    - cron: "0 13 * * *"
  push:
    paths:
      - "uploads/*.mp4"
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode to run"
        required: true
        default: "reel"
        type: choice
        options:
          - reel
          - weekly_reel
          - post
          - upload_reel
      prompt:
        description: "Custom text/prompt for the reel or post (leave empty for auto theme)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Configure Git identity
        run: |
          git config user.name "ig-influencer-bot"
          git config user.email "ig-influencer-bot@users.noreply.github.com"

      - name: Determine mode
        id: mode
        run: |
          # workflow_dispatch takes explicit mode input
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          # Push to uploads/*.mp4 → upload_reel
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "mode=upload_reel" >> "$GITHUB_OUTPUT"
          else
            # Scheduled runs: hour 13 = daily photo post, all other hours = reel every 2 hours
            HOUR=$(date -u +%H)
            if [ "$HOUR" = "13" ]; then
              echo "mode=post" >> "$GITHUB_OUTPUT"
            else
              echo "mode=reel" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Run automation
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUSTOM_PROMPT: ${{ github.event.inputs.prompt }}
        run: |
          if [ -n "${{ github.event.inputs.prompt }}" ]; then
            python main.py ${{ steps.mode.outputs.mode }} --prompt "${{ github.event.inputs.prompt }}"
          else
            python main.py ${{ steps.mode.outputs.mode }}
          fi
