name: Instagram Automation

on:
  schedule:
    # Every 2 hours clean bike/car reels (12 posts/day): 00:00, 02:00, 04:00, 06:00, 08:00, 10:00, 12:00, 14:00, 16:00, 18:00, 20:00, 22:00 UTC
    - cron: "15 */2 * * *"
    # Exactly at 12:00 AM Midnight (18:30 UTC / 12:00 AM IST) - Daily Study Reel (once per day)
    - cron: "30 18 * * *"
    # 1 Photo post daily at 13:00 UTC
    - cron: "0 13 * * *"
  push:
    paths:
      - "uploads/*.mp4"
      - "trigger.txt"
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode to run"
        required: true
        default: "reel"
        type: choice
        options:
          - reel
          - journey_reel
          - weekly_reel
          - post
          - upload_reel
      prompt:
        description: "Custom text/prompt for the reel or post (leave empty for auto theme)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: instagram
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          # Download pre-built static binary — avoids apt-daily dpkg lock hang
          curl -fsSL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
            | tar -xJ --strip-components=2 -C /usr/local/bin --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
          ffmpeg -version 2>&1 | head -1

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Configure Git identity
        run: |
          git config user.name "ig-influencer-bot"
          git config user.email "ig-influencer-bot@users.noreply.github.com"

      - name: Determine mode
        id: mode
        run: |
          # workflow_dispatch takes explicit mode input
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          # Push to trigger.txt or uploads/*.mp4
          elif [ "${{ github.event_name }}" = "push" ]; then
            if [ -f "trigger.txt" ]; then
              RAW_MODE=$(head -n 1 trigger.txt | awk '{print $1}')
              case "$RAW_MODE" in
                post|journey_reel|weekly_reel|reel|upload_reel)
                  MODE="$RAW_MODE"
                  ;;
                *)
                  MODE="weekly_reel"
                  ;;
              esac
              echo "mode=$MODE" >> "$GITHUB_OUTPUT"
            else
              echo "mode=upload_reel" >> "$GITHUB_OUTPUT"
            fi
          else
            # Scheduled runs: hour 13 = daily photo post, all other hours = reel every 2 hours
            # 12:00 AM Midnight (18:30 UTC): Daily Study Journey Reel (once per day)
            # Hour 13:00 UTC: Daily Photo Post
            # All other 2-hour runs: Clean Supercar & Superbike Reel with zero text overlay
            # Scheduled runs:
            # Hour >= 18 UTC (11:30 PM+ IST): Study journey reel window
            # Hour 13:00 UTC: Daily photo post
            # All other hours: Clean supercar & superbike reel
            HOUR=$(date -u +%H)
            if [ "$HOUR" -ge 18 ]; then
              echo "mode=journey_reel" >> "$GITHUB_OUTPUT"
            elif [ "$HOUR" = "13" ]; then
              echo "mode=post" >> "$GITHUB_OUTPUT"
            else
              echo "mode=reel" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Run automation
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUSTOM_PROMPT: ${{ github.event.inputs.prompt }}
          MODE_NAME: ${{ steps.mode.outputs.mode }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python main.py "$MODE_NAME"
