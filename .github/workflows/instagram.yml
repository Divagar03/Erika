name: Instagram Automation

on:
  schedule:
    # Photo posts: 03:30 and 13:30 UTC daily
    - cron: "30 3 * * *"
    - cron: "30 13 * * *"
    # Weekly reel: every Saturday at 12:00 UTC
    - cron: "0 12 * * 6"
  push:
    paths:
      - "uploads/*.mp4"
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode to run"
        required: true
        default: "post"
        type: choice
        options:
          - post
          - weekly_reel
          - upload_reel

permissions:
  contents: write

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Configure Git identity
        run: |
          git config user.name "ig-influencer-bot"
          git config user.email "ig-influencer-bot@users.noreply.github.com"

      - name: Determine mode
        id: mode
        run: |
          # workflow_dispatch takes explicit mode input
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          # Push to uploads/*.mp4 → upload_reel
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "mode=upload_reel" >> "$GITHUB_OUTPUT"
          else
            # Schedule: determine by cron time
            HOUR=$(date -u +%H)
            MINUTE=$(date -u +%M)
            WEEKDAY=$(date -u +%u)  # 1=Mon ... 6=Sat ... 7=Sun
            if [ "$WEEKDAY" = "6" ] && [ "$HOUR" = "12" ]; then
              echo "mode=weekly_reel" >> "$GITHUB_OUTPUT"
            else
              echo "mode=post" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Run automation
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-pro' }}
        run: |
          python main.py ${{ steps.mode.outputs.mode }}
