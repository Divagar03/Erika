name: Instagram Reels Automation

on:
  schedule:
    # Backup GitHub schedule: every 2 hours at :15 UTC (:45 IST), 24/7
    # Exact-time triggers run via push (trigger.txt) or workflow_dispatch (force=false);
    # slot idempotency skips duplicates automatically.
    - cron: "15 */2 * * *"
  push:
    paths:
      - "uploads/*.mp4"
      - "trigger.txt"
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode to run"
        required: true
        default: "reel"
        type: choice
        options:
          - reel
          - cinematic_slow_mo
          - speed_ramp
          - phonk_bass_drop
          - night_city
          - rolling_shots
          - engine_sound_showcase
          - upload_reel
          - youtube_short
      prompt:
        description: "Custom text/prompt for the reel (leave empty for auto theme)"
        required: false
        default: ""
        type: string
      force:
        description: "Bypass 2-hour slot cooldown (keep true for manual runs, false for external exact cron)"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: instagram-reel
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install FFmpeg
        run: |
          curl -fsSL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
            | tar -xJ --strip-components=2 -C /usr/local/bin --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
          ffmpeg -version 2>&1 | head -1

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Configure Git identity
        run: |
          git config user.name "ig-influencer-bot"
          git config user.email "ig-influencer-bot@users.noreply.github.com"

      - name: Pull latest changes
        run: |
          # Ensure latest registry.json and logs are present even if queued behind another run
          git pull --rebase origin main || true

      - name: Determine mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            if [ -f "trigger.txt" ]; then
              RAW_MODE=$(head -n 1 trigger.txt | awk '{print $1}')
              case "$RAW_MODE" in
                post|journey_reel|weekly_reel|reel|upload_reel|deep_dive|comparison|future_release|youtube_short|youtube_top10|collect_metrics)
                  MODE="$RAW_MODE"
                  ;;
                *)
                  MODE="reel"
                  ;;
              esac
              echo "mode=$MODE" >> "$GITHUB_OUTPUT"
            else
              echo "mode=upload_reel" >> "$GITHUB_OUTPUT"
            fi
          else
            # Dedicated reel workflow: scheduled triggers ALWAYS run reel mode
            echo "mode=reel" >> "$GITHUB_OUTPUT"
          fi

      - name: Run automation
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUSTOM_PROMPT: ${{ github.event.inputs.prompt }}
          FORCE_RUN: ${{ github.event.inputs.force }}
          MODE_NAME: ${{ steps.mode.outputs.mode }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python main.py "$MODE_NAME"
