name: Instagram & YouTube Automation

on:
  schedule:
    # Instagram Reels: every 2 hours, 24/7 (12 reels/day)
    - cron: "15 */2 * * *"
    # Daily YouTube Top 10 Short at 6:00 PM UTC
    - cron: "0 18 * * *"
    # Daily Study Journey Reel at 12:00 AM IST (18:30 UTC)
    - cron: "30 18 * * *"
    # Daily photo post at 1:00 PM UTC
    - cron: "0 13 * * *"
    # Daily metrics collection at 7:00 AM UTC
    - cron: "0 7 * * *"
  push:
    paths:
      - "uploads/*.mp4"
      - "trigger.txt"
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode to run"
        required: true
        default: "reel"
        type: choice
        options:
          - reel
          - deep_dive
          - comparison
          - future_release
          - journey_reel
          - weekly_reel
          - post
          - upload_reel
          - youtube_top10
          - collect_metrics
      prompt:
        description: "Custom text/prompt for the reel or post (leave empty for auto theme)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: instagram
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          curl -fsSL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
            | tar -xJ --strip-components=2 -C /usr/local/bin --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
          ffmpeg -version 2>&1 | head -1

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Configure Git identity
        run: |
          git config user.name "ig-influencer-bot"
          git config user.email "ig-influencer-bot@users.noreply.github.com"

      - name: Determine mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            if [ -f "trigger.txt" ]; then
              RAW_MODE=$(head -n 1 trigger.txt | awk '{print $1}')
              case "$RAW_MODE" in
                post|journey_reel|weekly_reel|reel|upload_reel|deep_dive|comparison|future_release|youtube_top10|collect_metrics)
                  MODE="$RAW_MODE"
                  ;;
                *)
                  MODE="weekly_reel"
                  ;;
              esac
              echo "mode=$MODE" >> "$GITHUB_OUTPUT"
            else
              echo "mode=upload_reel" >> "$GITHUB_OUTPUT"
            fi
          else
            HOUR=$(date -u +%H)
            MIN=$(date -u +%M)
            # 18:30 UTC = Study journey reel (runs at :30)
            if [ "$HOUR" = "18" ] && [ "$MIN" -ge 20 ] && [ "$MIN" -le 45 ]; then
              echo "mode=journey_reel" >> "$GITHUB_OUTPUT"
            # 18:00 UTC = YouTube Top 10 compilation Short (runs at :00)
            elif [ "$HOUR" = "18" ]; then
              echo "mode=youtube_top10" >> "$GITHUB_OUTPUT"
            # 07:00 UTC = Daily metrics collection
            elif [ "$HOUR" = "07" ]; then
              echo "mode=collect_metrics" >> "$GITHUB_OUTPUT"
            # 13:00 UTC = Daily photo post
            elif [ "$HOUR" = "13" ]; then
              echo "mode=post" >> "$GITHUB_OUTPUT"
            else
              echo "mode=reel" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Run automation
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUSTOM_PROMPT: ${{ github.event.inputs.prompt }}
          MODE_NAME: ${{ steps.mode.outputs.mode }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python main.py "$MODE_NAME"
